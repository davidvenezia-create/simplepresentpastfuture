<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verb Tense Time Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --font-display:'Space Grotesk','Segoe UI',sans-serif;
    --font-body:'Public Sans','Segoe UI',system-ui,-apple-system,sans-serif;
    --bg-page:#DCE6E2;
    --card-bg:#F6FAF8;
    --card-bg-2:#E8EFEC;
    --text:#1C2622;
    --text-soft:#56655F;
    --line:#BFD0C8;
    --past:#2E6B5E;
    --past-soft:#D8E7E1;
    --present:#B9812E;
    --present-soft:#F1E3C6;
    --future:#6A4FB0;
    --future-soft:#E4DEF4;
    --wrong:#A63A2E;
    --wrong-soft:#F1D9D3;
    --shadow:rgba(20,30,26,0.18);
    --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-page:#101713;
      --card-bg:#1B241E;
      --card-bg-2:#212C24;
      --text:#E7F2EC;
      --text-soft:#9FB3A8;
      --line:#33443A;
      --past:#59B39E; --past-soft:#1E332C;
      --present:#E0AE5C; --present-soft:#3A2E17;
      --future:#9C86E0; --future-soft:#2A2440;
      --wrong:#D97A6C; --wrong-soft:#3B2320;
      --shadow:rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg-page:#101713; --card-bg:#1B241E; --card-bg-2:#212C24;
    --text:#E7F2EC; --text-soft:#9FB3A8; --line:#33443A;
    --past:#59B39E; --past-soft:#1E332C;
    --present:#E0AE5C; --present-soft:#3A2E17;
    --future:#9C86E0; --future-soft:#2A2440;
    --wrong:#D97A6C; --wrong-soft:#3B2320;
    --shadow:rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0;background:var(--bg-page);color:var(--text);font-family:var(--font-body);
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-text-size-adjust:100%;
  }
  #app{max-width:640px;margin:0 auto;padding:18px 16px 40px;}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;line-height:1.25;}
  p{margin:0;line-height:1.55;}

  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .top .ti{font-size:26px;}
  .top h1{font-size:1.3rem;}
  .top .sub{font-size:0.78rem;color:var(--text-soft);margin-top:2px;}

  .card{
    background:var(--card-bg);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 3px 0 var(--line), 0 6px 14px var(--shadow);
    padding:18px;margin-bottom:14px;
  }
  .timeline{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:14px;font-family:var(--font-display);font-size:0.82rem;}
  .timeline span{flex:1;text-align:center;}
  .timeline .arrow{color:var(--text-soft);font-size:1.1rem;}
  .timeline .now{background:var(--card-bg-2);border-radius:6px;padding:4px 8px;font-weight:700;}

  .btn{
    font-family:var(--font-body);font-weight:700;font-size:0.92rem;border:none;border-radius:9px;
    padding:12px 18px;cursor:pointer;background:var(--past);color:#fff;
    box-shadow:0 3px 0 rgba(0,0,0,0.18);transition:transform .08s ease;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,0.18);}
  .btn:disabled{opacity:.42;cursor:not-allowed;}
  .btn.secondary{background:transparent;color:var(--text);border:1.5px solid var(--line);box-shadow:none;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

  .station-grid{display:grid;gap:12px;margin-top:14px;}
  .station-tile{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
    background:var(--card-bg);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;box-shadow:0 3px 0 var(--line), 0 5px 12px var(--shadow);
    font-family:var(--font-body);color:var(--text);
  }
  .dial{
    flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:20px;background:var(--card-bg-2);
  }
  .station-tile .st-title{font-weight:800;font-size:0.98rem;}
  .station-tile .st-status{font-size:0.76rem;color:var(--text-soft);margin-top:2px;}
  .station-tile .st-status.done{color:var(--past);font-weight:700;}

  .topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .back-link{background:none;border:none;color:var(--text-soft);font-weight:700;font-size:0.85rem;cursor:pointer;padding:6px 0;font-family:var(--font-body);}
  .station-code{font-family:var(--font-display);font-size:0.78rem;letter-spacing:0.5px;}

  .dots{display:flex;gap:6px;margin-bottom:12px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
  .dot.active{background:currentColor;}
  .dot.done{background:currentColor;opacity:0.55;}

  .prompt{font-weight:700;font-size:1.02rem;margin-bottom:12px;}
  .sentence{font-size:1.05rem;margin-bottom:12px;padding:10px 12px;background:var(--card-bg-2);border-radius:8px;border-left:4px solid var(--accent, var(--past));}

  .opt-list{display:grid;gap:8px;}
  .opt{
    display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card-bg-2);
    border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;
    font-family:var(--font-body);font-size:0.94rem;color:var(--text);width:100%;
  }
  .opt .opt-mark{flex:0 0 auto;width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:0.75rem;margin-top:1px;background:var(--card-bg);}
  .opt.selected{border-color:var(--accent, var(--past));}
  .opt.selected .opt-mark{background:var(--accent, var(--past));border-color:var(--accent, var(--past));color:#fff;}
  .opt.correct{border-color:var(--past);background:var(--past-soft);}
  .opt.correct .opt-mark{background:var(--past);border-color:var(--past);color:#fff;}
  .opt.wrong{border-color:var(--wrong);background:var(--wrong-soft);}
  .opt.wrong .opt-mark{background:var(--wrong);border-color:var(--wrong);color:#fff;}
  .opt[data-locked="1"]{cursor:default;}

  .chip-row{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{
    flex:1 1 auto;min-width:110px;text-align:center;padding:11px 10px;border-radius:9px;
    border:1.5px solid var(--line);background:var(--card-bg-2);font-weight:700;font-size:0.88rem;
    cursor:pointer;color:var(--text);font-family:var(--font-body);
  }
  .chip.selected{border-color:var(--accent);}
  .chip.correct{border-color:var(--past);background:var(--past-soft);color:var(--past);}
  .chip.wrong{border-color:var(--wrong);background:var(--wrong-soft);color:var(--wrong);}
  .chip[data-locked="1"]{cursor:default;}

  .feedback{margin-top:12px;padding:11px 13px;border-radius:8px;font-size:0.88rem;display:flex;gap:8px;align-items:flex-start;}
  .feedback.good{background:var(--past-soft);color:var(--past);}
  .feedback.bad{background:var(--wrong-soft);color:var(--wrong);}
  .feedback .fb-text{color:var(--text);}

  .rule-box{background:var(--card-bg-2);border:1px dashed var(--line);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:0.92rem;}

  .stamp-wrap{text-align:center;padding:22px 10px;}
  .stamp{
    display:inline-block;font-family:var(--font-display);font-weight:700;font-size:1.25rem;
    border:4px solid var(--accent);color:var(--accent);border-radius:10px;padding:8px 20px;
    transform:rotate(-6deg) scale(0.6);opacity:0;animation:stampIn .45s ease forwards;
  }
  @keyframes stampIn{0%{transform:rotate(-6deg) scale(2.2);opacity:0;}60%{transform:rotate(-6deg) scale(0.92);opacity:1;}100%{transform:rotate(-6deg) scale(1);opacity:1;}}
  .stamp-copy{margin-top:14px;color:var(--text-soft);font-size:0.9rem;}

  .journal-card textarea{
    width:100%;min-height:120px;border-radius:8px;border:1.5px solid var(--line);
    background:var(--card-bg-2);color:var(--text);font-family:var(--font-body);font-size:0.94rem;
    padding:10px 12px;resize:vertical;
  }
  .journal-card textarea:focus{outline:2px solid var(--future);outline-offset:1px;}
  .word-count{font-size:0.75rem;color:var(--text-soft);text-align:right;margin-top:4px;}
  .checklist{display:grid;gap:6px;margin-top:12px;}
  .checklist label{display:flex;gap:8px;align-items:flex-start;font-size:0.86rem;color:var(--text-soft);cursor:pointer;}
  .checklist input{margin-top:3px;}
  .frame{background:var(--future-soft);border-radius:8px;padding:9px 11px;font-size:0.82rem;color:var(--text);margin-top:10px;}

  .rank-bar{background:var(--card-bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:2px;}
  .rank-top{display:flex;justify-content:space-between;align-items:baseline;}
  .rank-name{font-family:var(--font-display);font-weight:700;font-size:1.02rem;}
  .rank-score{font-size:0.8rem;color:var(--text-soft);}
  .meter{height:9px;border-radius:5px;background:var(--line);margin-top:8px;overflow:hidden;}
  .meter-fill{height:100%;background:var(--past);transition:width .4s ease;}

  .foot-reset{text-align:center;margin-top:22px;}
  .foot-reset button{background:none;border:none;color:var(--text-soft);font-size:0.78rem;text-decoration:underline;cursor:pointer;font-family:var(--font-body);}
  :focus-visible{outline:3px solid var(--present);outline-offset:2px;}
</style>
</head>
<body>
<div id="app" role="main"></div>

<script>
(function(){
  "use strict";

  /* ---------------- data collection ---------------- */
  // Paste your Google Apps Script Web App URL between the quotes below.
  // Leave it blank ("") to run the app with no data collection at all.
  var WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwV7Hd_JRL54Xbxm2tiAFx3kWm_WFO5nxSotzCD0PiAuEYtx4Z3AlTQ3UwwJYrsOKS6/exec";

  function sendEvent(evt){
    if(!WEBHOOK_URL) return;
    var payload = Object.assign({
      app:"verb-tense-time-machine",
      student: (state.student && state.student.name) || "",
      period: (state.student && state.student.period) || "",
      ts: new Date().toISOString()
    }, evt);
    try{
      fetch(WEBHOOK_URL, {
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify(payload)
      }).catch(function(){});
    }catch(e){ /* ignore network errors, never block the student's work */ }
  }

  /* ---------------- content ---------------- */

  var STATIONS = [
    {
      id:"past", label:"Simple Past", icon:"\u23EA", accent:"var(--past)",
      code:"STATION 1 \u2014 REWIND",
      rule:"Simple past describes an action that started AND finished in the past. Regular verbs add \u2013ed (walk \u2192 walked). Many common verbs are irregular (go \u2192 went, eat \u2192 ate, see \u2192 saw).",
      timeline:["Past \u2713","Now","Future"],
      items:[
        {type:"mcq", sentence:"Yesterday, my sister ____ a letter to our grandmother.",
         options:["write","writes","wrote","will write"], correct:2,
         explain:"\u201CYesterday\u201D signals a finished action, and \u201Cwrote\u201D is the irregular past form of write."},
        {type:"mcq", sentence:"Last week, we ____ to the museum on a field trip.",
         options:["go","goes","went","will go"], correct:2,
         explain:"\u201CLast week\u201D tells us this already happened, so we need the past form \u2014 went."},
        {type:"mcq", sentence:"Which sentence is in the SIMPLE PAST tense?",
         options:["He plays soccer every Saturday.","He played soccer last Saturday.","He will play soccer next Saturday."], correct:1,
         explain:"\u201CPlayed\u201D plus \u201Clast Saturday\u201D both point to a finished action."},
        {type:"mcq", sentence:"The chef ____ a delicious soup an hour ago.",
         options:["make","makes","made","will make"], correct:2,
         explain:"\u201Cmake\u201D is irregular in the past \u2014 it becomes \u201Cmade,\u201D not \u201Cmaked.\u201D"}
      ]
    },
    {
      id:"present", label:"Simple Present", icon:"\uD83D\uDD01", accent:"var(--present)",
      code:"STATION 2 \u2014 HOLD",
      rule:"Simple present describes habits, routines, and facts that are generally true. Add \u2013s or \u2013es when the subject is he, she, or it.",
      timeline:["Past","Now \u2713","Future"],
      items:[
        {type:"mcq", sentence:"My mother ____ coffee every morning.",
         options:["drink","drinks","drank","will drink"], correct:1,
         explain:"\u201CEvery morning\u201D is a routine, and the subject (my mother = she) needs the \u2013s ending."},
        {type:"mcq", sentence:"Water ____ at 100 degrees Celsius.",
         options:["boil","boils","boiled","will boil"], correct:1,
         explain:"This is a scientific fact that is always true, so it stays in the simple present."},
        {type:"mcq", sentence:"Which sentence describes a HABIT \u2014 something that happens regularly?",
         options:["She studied for the test last night.","She studies every night after dinner.","She will study tomorrow."], correct:1,
         explain:"\u201CEvery night\u201D is the clue \u2014 this is something she does regularly, not once."},
        {type:"mcq", sentence:"The students ____ their homework before class starts.",
         options:["does","do","did","will do"], correct:1,
         explain:"The subject is plural (the students = they), so no \u2013s is added: \u201Cdo,\u201D not \u201Cdoes.\u201D"}
      ]
    },
    {
      id:"future", label:"Simple Future", icon:"\u23E9", accent:"var(--future)",
      code:"STATION 3 \u2014 FAST-FORWARD",
      rule:"Simple future describes something that hasn't happened yet \u2014 a plan, a prediction, or a promise. Build it with will + the base verb (or going to + base verb).",
      timeline:["Past","Now","Future \u2713"],
      items:[
        {type:"mcq", sentence:"Tomorrow, our class ____ a test on verb tenses.",
         options:["has","had","will have","have"], correct:2,
         explain:"\u201CTomorrow\u201D hasn't happened yet, so we need will + the base verb have."},
        {type:"mcq", sentence:"I think it ____ rain later today.",
         options:["rains","rained","will rain","rain"], correct:2,
         explain:"This is a prediction about something that hasn't happened \u2014 the classic job of simple future."},
        {type:"mcq", sentence:"Which sentence is in the SIMPLE FUTURE tense?",
         options:["We visited my cousins last summer.","We visit my cousins every summer.","We will visit my cousins next summer."], correct:2,
         explain:"\u201Cwill visit\u201D plus \u201Cnext summer\u201D both point ahead in time."},
        {type:"mcq", sentence:"She ____ you as soon as she arrives.",
         options:["call","calls","called","will call"], correct:3,
         explain:"The calling hasn't happened yet \u2014 it depends on her arriving first \u2014 so it needs will call."}
      ]
    },
    {
      id:"mixed", label:"Mixed Review", icon:"\uD83C\uDF9B\uFE0F", accent:"var(--text)",
      code:"STATION 4 \u2014 ALL DIALS",
      rule:"Now the dials are unlabeled. Read each sentence and decide which time it belongs to \u2014 past, present, or future.",
      timeline:null,
      items:[
        {type:"identify", sentence:"My family moved to New Jersey three years ago.",
         options:["Past","Present","Future"], correct:0,
         explain:"\u201CThree years ago\u201D is a finished action \u2014 simple past."},
        {type:"identify", sentence:"I usually walk to school with my neighbor.",
         options:["Past","Present","Future"], correct:1,
         explain:"\u201CUsually\u201D signals a routine \u2014 simple present."},
        {type:"identify", sentence:"Our team will travel to the state tournament next month.",
         options:["Past","Present","Future"], correct:2,
         explain:"\u201Cwill travel\u201D plus \u201Cnext month\u201D \u2014 simple future."},
        {type:"identify", sentence:"Bernards High School has about 900 students.",
         options:["Past","Present","Future"], correct:1,
         explain:"This is a fact that is true right now \u2014 simple present."}
      ]
    }
  ];

  var JOURNAL = {
    id:"journal", label:"Time Traveler's Journal", icon:"\uD83D\uDCD3", accent:"var(--future)",
    code:"STATION 5 \u2014 FIELD NOTES",
    intro:"This station isn't scored automatically \u2014 it's your chance to explain your thinking in writing. Your teacher will read your journal.",
    prompts:[
      {
        title:"Fix the time machine",
        text:"A classmate wrote this sentence: \u201CYesterday I go to the store and buy milk.\u201D Explain what's wrong with the verb tenses, show how you would fix it, and explain HOW you knew it needed to change.",
        frame:"Sentence frame: \u201CThe verb ____ should be ____ because ____.\u201D",
        checklist:["I named which word(s) needed to change.","I wrote the corrected sentence.","I explained WHY (what clue told me the tense)."]
      },
      {
        title:"Your own timeline",
        text:"Write two sentences about your own life: one in SIMPLE PAST (something that already happened) and one in SIMPLE FUTURE (something you plan to do). Then explain how you knew which tense to use for each one.",
        frame:"Sentence frame: \u201CI used ____ tense in my first sentence because ____. I used ____ tense in my second sentence because ____.\u201D",
        checklist:["I wrote one past-tense sentence.","I wrote one future-tense sentence.","I explained my reasoning for both."]
      }
    ]
  };

  /* ---------------- state ---------------- */

  var STORE_KEY = "vt-timemachine-progress-v1";

  function blankProgress(){
    var p = {};
    STATIONS.forEach(function(s){ p[s.id] = s.items.map(function(){ return 0; }); });
    p.journal = [ {text:"", checks:[false,false,false], done:false}, {text:"", checks:[false,false,false], done:false} ];
    return p;
  }

  var state = { screen:"gate", stationIdx:0, itemIdx:0, progress: blankProgress(), student:{name:"",period:""}, temp:{} };

  var STUDENT_KEY = "vt-timemachine-student-v1";
  function loadStudent(){
    try{
      var raw = window.localStorage.getItem(STUDENT_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && parsed.name) state.student = parsed;
      }
    }catch(e){}
  }
  function saveStudent(){
    try{ window.localStorage.setItem(STUDENT_KEY, JSON.stringify(state.student)); }catch(e){}
  }

  function loadProgress(){
    try{
      var raw = window.localStorage.getItem(STORE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && parsed.journal) state.progress = parsed;
      }
    }catch(e){}
  }
  function saveProgress(){
    try{ window.localStorage.setItem(STORE_KEY, JSON.stringify(state.progress)); }catch(e){}
  }

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  function stationStars(s){ return state.progress[s.id].reduce(function(a,b){return a+b;},0); }
  function stationMax(s){ return s.items.length*2; }
  function stationDone(s){ return state.progress[s.id].every(function(v){return v>0;}); }
  function totalStars(){ var t=0; STATIONS.forEach(function(s){t+=stationStars(s);}); return t; }
  function totalMax(){ var t=0; STATIONS.forEach(function(s){t+=stationMax(s);}); return t; }
  function journalDoneCount(){ return state.progress.journal.filter(function(j){return j.done;}).length; }

  /* ---------------- render ---------------- */
  var app = document.getElementById("app");

  function render(){
    if(state.screen==="gate") return renderGate();
    if(state.screen==="menu") return renderMenu();
    if(state.screen==="station") return renderStation();
    if(state.screen==="journal") return renderJournal();
  }

  function renderGate(){
    var s = state.student;
    var html = topHeader();
    html += '<div class="card"><h2 style="font-size:1.05rem;">Before you start\u2026</h2>';
    html += '<p style="margin-top:8px;color:var(--text-soft);font-size:0.94rem;">Tell us who you are so your teacher can see your work.</p>';
    html += '<div style="display:grid;gap:8px;margin-top:14px;">';
    html += '<label style="font-size:0.85rem;font-weight:700;">First name &amp; last initial</label>';
    html += '<input type="text" placeholder="e.g., Alex R." value="'+esc(s.name)+'" oninput="VT.setStudentField(\'name\',this.value)" style="padding:11px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--card-bg-2);color:var(--text);font-family:var(--font-body);font-size:0.94rem;">';
    html += '<label style="font-size:0.85rem;font-weight:700;">Class period</label>';
    html += '<input type="text" placeholder="e.g., Period 3" value="'+esc(s.period)+'" oninput="VT.setStudentField(\'period\',this.value)" style="padding:11px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--card-bg-2);color:var(--text);font-family:var(--font-body);font-size:0.94rem;">';
    html += '</div>';
    html += '<div class="btn-row"><button class="btn" id="gate-submit" '+((s.name.trim()&&s.period.trim())?'':'disabled')+' onclick="VT.submitStudent()">Board the time machine</button></div>';
    html += '</div>';
    app.innerHTML = html;
  }

  function topHeader(){
    return '<div class="top"><span class="ti">\u23F1\uFE0F</span><div><h1>Verb Tense Time Machine</h1><div class="sub">Simple past &middot; present &middot; future</div></div></div>';
  }

  function renderMenu(){
    var pct = Math.round((totalStars()/totalMax())*100);
    var html = topHeader();
    html += '<div class="card"><h2 style="font-size:1.05rem;">Welcome aboard</h2><p style="margin-top:8px;color:var(--text-soft);font-size:0.94rem;">Every trip through the machine has three dials. Set the dial, read the sentence, and pick the verb that matches the moment in time.</p>';
    html += '<div class="timeline"><span>\u2190 Past</span><span class="arrow">\u2014</span><span class="now">Now</span><span class="arrow">\u2014</span><span>Future \u2192</span></div>';
    html += '</div>';

    html += '<div class="rank-bar"><div class="rank-top"><span class="rank-name">'+totalStars()+' / '+totalMax()+' dials locked in</span><span class="rank-score">'+journalDoneCount()+'/2 journal entries</span></div><div class="meter"><div class="meter-fill" style="width:'+pct+'%"></div></div></div>';

    html += '<div class="station-grid">';
    STATIONS.forEach(function(s,i){
      var done = stationDone(s);
      var started = stationStars(s)>0 && !done;
      html += '<button class="station-tile" onclick="VT.openStation('+i+')"><span class="dial" style="color:'+s.accent+'">'+s.icon+'</span><div><div class="st-title">'+esc(s.label)+'</div><div class="st-status'+(done?' done':'')+'">'+(done?"Locked in":(started?"In progress":"Not started"))+'</div></div></button>';
    });
    var jDone = journalDoneCount();
    html += '<button class="station-tile" onclick="VT.openJournal()"><span class="dial" style="color:'+JOURNAL.accent+'">'+JOURNAL.icon+'</span><div><div class="st-title">'+esc(JOURNAL.label)+'</div><div class="st-status'+(jDone===2?' done':'')+'">'+(jDone===2?"Locked in":(jDone===1?"1 of 2 written":"Not started"))+'</div></div></button>';
    html += '</div>';

    html += '<div class="foot-reset"><button onclick="VT.resetAll()">Start the whole review over</button></div>';
    app.innerHTML = html;
  }

  function renderStation(){
    var s = STATIONS[state.stationIdx];
    if(state.itemIdx >= s.items.length) return renderStationDone(s);
    var item = s.items[state.itemIdx];
    var html = '<div class="topline"><button class="back-link" onclick="VT.go(\'menu\')">\u2190 Control room</button><span class="station-code" style="color:'+s.accent+'">'+esc(s.code)+'</span></div>';
    html += '<h2 style="font-size:1.1rem;margin-bottom:10px;">'+s.icon+' '+esc(s.label)+'</h2>';
    if(state.itemIdx===0){
      html += '<div class="rule-box">'+esc(s.rule)+'</div>';
    }
    html += '<div class="dots">';
    s.items.forEach(function(_,i){
      var cls="dot"; if(i===state.itemIdx) cls+=" active"; else if(state.progress[s.id][i]>0) cls+=" done";
      html += '<span class="'+cls+'" style="color:'+s.accent+'"></span>';
    });
    html += '</div>';

    html += '<div class="card" style="--accent:'+s.accent+'">';
    html += '<div class="prompt">'+(item.type==="identify"?"What time is this sentence in?":"Choose the correct verb.")+'</div>';
    html += '<div class="sentence" style="--accent:'+s.accent+'">'+esc(item.sentence)+'</div>';

    var t = state.temp;
    if(item.type==="mcq"){
      html += '<div class="opt-list">';
      item.options.forEach(function(opt,i){
        var cls="opt", locked=t.checked;
        if(locked){ if(i===item.correct) cls+=" correct"; else if(i===t.sel) cls+=" wrong"; }
        else if(i===t.sel) cls+=" selected";
        html += '<button class="'+cls+'" style="--accent:'+s.accent+'" '+(locked?'data-locked="1"':'')+' onclick="'+(locked?'':'VT.select('+i+')')+'"><span class="opt-mark">'+String.fromCharCode(65+i)+'</span><span>'+esc(opt)+'</span></button>';
      });
      html += '</div>';
    } else {
      html += '<div class="chip-row">';
      item.options.forEach(function(opt,i){
        var cls="chip", locked=t.checked;
        if(locked){ if(i===item.correct) cls+=" correct"; else if(i===t.sel) cls+=" wrong"; }
        else if(i===t.sel) cls+=" selected";
        html += '<button class="'+cls+'" style="--accent:'+s.accent+'" '+(locked?'data-locked="1"':'')+' onclick="'+(locked?'':'VT.select('+i+')')+'">'+esc(opt)+'</button>';
      });
      html += '</div>';
    }

    if(t.checked){
      var right = t.sel===item.correct;
      html += '<div class="feedback '+(right?'good':'bad')+'"><span>'+(right?'\u2705':'\u26A0\uFE0F')+'</span><span class="fb-text">'+esc(item.explain)+'</span></div>';
      html += '<div class="btn-row"><button class="btn" style="background:'+s.accent+'" onclick="VT.nextItem()">Continue</button></div>';
    } else {
      html += '<div class="btn-row"><button class="btn" style="background:'+s.accent+'" '+(t.sel===undefined?'disabled':'')+' onclick="VT.check()">Check</button></div>';
    }
    html += '</div>';
    app.innerHTML = html;
  }

  function renderStationDone(s){
    var html = '<div class="topline"><button class="back-link" onclick="VT.go(\'menu\')">\u2190 Control room</button><span class="station-code" style="color:'+s.accent+'">'+esc(s.code)+'</span></div>';
    html += '<div class="card stamp-wrap" style="--accent:'+s.accent+'">';
    html += '<span class="stamp" style="--accent:'+s.accent+'">TIME LOCKED IN</span>';
    html += '<div class="stamp-copy">You finished '+esc(s.label)+'. ('+stationStars(s)+'/'+stationMax(s)+' points)</div>';
    var idx = STATIONS.indexOf(s);
    html += '<div class="btn-row" style="justify-content:center;">';
    if(idx < STATIONS.length-1){
      html += '<button class="btn" style="background:'+s.accent+'" onclick="VT.openStation('+(idx+1)+')">Next station \u2192</button>';
    } else {
      html += '<button class="btn" style="background:'+JOURNAL.accent+'" onclick="VT.openJournal()">Go to the Journal \u2192</button>';
    }
    html += '<button class="btn secondary" onclick="VT.go(\'menu\')">Control room</button>';
    html += '</div></div>';
    app.innerHTML = html;
  }

  function renderJournal(){
    var html = '<div class="topline"><button class="back-link" onclick="VT.go(\'menu\')">\u2190 Control room</button><span class="station-code" style="color:'+JOURNAL.accent+'">'+esc(JOURNAL.code)+'</span></div>';
    html += '<h2 style="font-size:1.1rem;margin-bottom:8px;">'+JOURNAL.icon+' '+esc(JOURNAL.label)+'</h2>';
    html += '<div class="rule-box">'+esc(JOURNAL.intro)+'</div>';

    JOURNAL.prompts.forEach(function(p,pi){
      var entry = state.progress.journal[pi];
      html += '<div class="card journal-card" style="--accent:'+JOURNAL.accent+'">';
      html += '<div class="prompt">'+(pi+1)+'. '+esc(p.title)+'</div>';
      html += '<p style="font-size:0.94rem;margin-bottom:4px;">'+esc(p.text)+'</p>';
      html += '<div class="frame">'+esc(p.frame)+'</div>';
      html += '<textarea id="journal-ta-'+pi+'" oninput="VT.journalInput('+pi+',this.value)" placeholder="Write your answer here...">'+esc(entry.text)+'</textarea>';
      html += '<div class="word-count">'+(entry.text.trim()?entry.text.trim().split(/\s+/).length:0)+' words</div>';
      html += '<div class="checklist">';
      p.checklist.forEach(function(c,ci){
        html += '<label><input type="checkbox" '+(entry.checks[ci]?'checked':'')+' onchange="VT.journalCheck('+pi+','+ci+',this.checked)"> '+esc(c)+'</label>';
      });
      html += '</div>';
      html += '<div class="btn-row">';
      html += '<button class="btn" style="background:'+JOURNAL.accent+'" onclick="VT.journalDone('+pi+')">'+(entry.done?"Marked complete \u2713":"Mark as complete")+'</button>';
      html += '<button class="btn secondary" onclick="VT.journalCopy('+pi+')">Copy my answer</button>';
      html += '</div>';
      html += '</div>';
    });
    app.innerHTML = html;
  }

  /* ---------------- actions ---------------- */
  var VT = {};

  VT.go = function(screen){ state.screen=screen; render(); window.scrollTo(0,0); };

  VT.setStudentField = function(field,val){
    state.student[field] = val;
    var btn = document.getElementById("gate-submit");
    if(btn) btn.disabled = !(state.student.name.trim() && state.student.period.trim());
  };
  VT.submitStudent = function(){
    if(!state.student.name.trim() || !state.student.period.trim()) return;
    saveStudent();
    sendEvent({event:"start"});
    state.screen = "menu";
    render();
  };

  VT.openStation = function(i){
    state.stationIdx=i;
    var s = STATIONS[i];
    var arr = state.progress[s.id];
    var firstUnfinished = arr.findIndex(function(v){return v===0;});
    state.itemIdx = firstUnfinished===-1 ? arr.length : firstUnfinished;
    state.temp = {};
    state.screen="station";
    render(); window.scrollTo(0,0);
  };

  VT.select = function(i){ state.temp.sel=i; render(); };
  VT.check = function(){
    if(state.temp.sel===undefined) return;
    state.temp.checked = true;
    var s = STATIONS[state.stationIdx], item = s.items[state.itemIdx];
    var right = state.temp.sel===item.correct;
    var cur = state.progress[s.id][state.itemIdx];
    var award = right ? 2 : 1;
    if(award>cur){ state.progress[s.id][state.itemIdx]=award; saveProgress(); }
    sendEvent({event:"answer", station:s.label, itemIndex:state.itemIdx, itemType:item.type, correct:right});
    render();
  };
  VT.nextItem = function(){
    state.itemIdx++;
    state.temp = {};
    if(state.itemIdx >= STATIONS[state.stationIdx].items.length){
      var st = STATIONS[state.stationIdx];
      sendEvent({event:"station_complete", station:st.label, stars:stationStars(st), maxStars:stationMax(st)});
    }
    render(); window.scrollTo(0,0);
  };

  VT.openJournal = function(){ state.screen="journal"; render(); window.scrollTo(0,0); };
  VT.journalInput = function(pi, val){
    state.progress.journal[pi].text = val;
    saveProgress();
    var wc = document.querySelectorAll(".word-count")[pi];
    if(wc) wc.textContent = (val.trim()?val.trim().split(/\s+/).length:0)+" words";
  };
  VT.journalCheck = function(pi,ci,checked){
    state.progress.journal[pi].checks[ci] = checked;
    saveProgress();
  };
  VT.journalDone = function(pi){
    state.progress.journal[pi].done = true;
    saveProgress();
    var entry = state.progress.journal[pi];
    sendEvent({
      event:"journal_submit",
      promptTitle: JOURNAL.prompts[pi].title,
      text: entry.text,
      wordCount: entry.text.trim() ? entry.text.trim().split(/\s+/).length : 0,
      checksCompleted: entry.checks.filter(Boolean).length,
      checksTotal: entry.checks.length
    });
    render();
  };
  VT.journalCopy = function(pi){
    var text = state.progress.journal[pi].text || "";
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text);
      } else {
        var ta = document.getElementById("journal-ta-"+pi);
        ta.select();
        document.execCommand("copy");
      }
    }catch(e){}
  };

  VT.resetAll = function(){
    state.progress = blankProgress();
    saveProgress();
    render();
  };

  window.VT = VT;

  /* ---------------- boot ---------------- */
  loadProgress();
  loadStudent();
  if(state.student.name.trim() && state.student.period.trim()){
    state.screen = "menu";
  }
  render();
})();
</script>
</body>
</html>
